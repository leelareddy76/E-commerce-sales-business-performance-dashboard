name: Python Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend and tests
        env:
           PYTHONPATH: ${{ github.workspace }}
        run: |
         python -m uvicorn app.backend:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
            
         for i in {1..30}; do
           if curl -fsS http://127.0.0.1:8000/kpis > /dev/null; then
             echo "Backend is ready"
             break
           fi
           echo "Waiting for backend..."
           sleep 1
         done
            
         curl -fsS http://127.0.0.1:8000/kpis > /dev/null
            
         pytest -q
